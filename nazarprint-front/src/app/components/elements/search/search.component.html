<div class="search">
  <div class="search__input-wrap">
    <svg class="search__icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input
      class="search__input"
      type="text"
      [(ngModel)]="query"
      (input)="onInput()"
      (focus)="onFocus()"
      placeholder="Поиск товаров..."
      autocomplete="off"
    />
    <div class="search__spinner" *ngIf="loading"></div>
    <button class="search__clear" *ngIf="query" (click)="selectResult()">✕</button>
  </div>

  <div class="search__dropdown" *ngIf="open && (results.length > 0 || loading)">
    <div class="search__loading" *ngIf="loading && results.length === 0">Поиск...</div>

    <a
      *ngFor="let item of results"
      class="search__result"
      [routerLink]="['/catalogs', item.categorySlug, item.id]"
      (click)="selectResult()"
    >
      <div class="search__result-img">
        <img *ngIf="item.image" [src]="item.image" [alt]="item.name" />
        <div class="search__result-placeholder" *ngIf="!item.image">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        </div>
      </div>
      <div class="search__result-info">
        <span class="search__result-name">{{ item.name }}</span>
        <span class="search__result-meta">{{ item.categoryName }}<ng-container *ngIf="item.subcategory"> · {{ item.subcategory }}</ng-container></span>
      </div>
      <span class="search__result-price">{{ item.price | number }} тг</span>
    </a>

    <div class="search__empty" *ngIf="!loading && results.length === 0">
      Ничего не найдено
    </div>
  </div>
</div>

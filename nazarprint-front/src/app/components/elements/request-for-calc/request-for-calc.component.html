<div class="request-title">Заявка на просчет</div>
<div class="request-for-calc">
  <div class="form-wrapper">
    <img src="/assets/order-form.png" alt="Order form" class="order-form-img" />
    <div class="form-content">
      <div class="success-message" *ngIf="submitSuccess">
        Заявка успешно отправлена! Мы свяжемся с вами в ближайшее время.
      </div>

      <div class="error-message" *ngIf="submitError">
        {{ submitError }}
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Имя</label>
          <input id="name" type="text" formControlName="name" placeholder="Ваше имя" />
        </div>

        <div class="form-group">
          <label for="phone">Телефон</label>
          <input id="phone" type="tel" appPhoneMask formControlName="phone" placeholder="+7 (___) ___-__-__" />
        </div>

        <div class="form-group">
          <label for="details">Подробнее о заказе</label>
          <textarea id="details" formControlName="details" placeholder="Описание заказа..."></textarea>
        </div>

        <div class="form-group quantity">
          <label>Количество изделий в заказе</label>
          <div class="quantity-controls">
            <button type="button" (click)="decreaseQuantity()">-</button>
            <input type="number" formControlName="quantity" />
            <button type="button" (click)="increaseQuantity()">+</button>
          </div>
        </div>

        <div class="form-group contact-methods" formGroupName="contactMethod">
          <label>Выберите способ связи с вами:</label>
          <div class="input_btns">
            <label>
              <input type="checkbox" formControlName="phoneCall" /> Телефонный звонок
            </label>
            <label>
              <input type="checkbox" formControlName="whatsapp" /> WhatsApp
            </label>
            <label>
              <input type="checkbox" formControlName="telegram" /> Telegram
            </label>
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Отправка...' : 'Отправить' }}
        </button>
      </form>
    </div>
  </div>
</div>

<div class="category-page">

        <div class="intro_content">
            <h4 class="intro_title">Стильные аксессуары и галантерея с вашим дизайном</h4>

        </div>
    </div>

    <div class="container">
        <h3 class="product-block-title">Аксессуары</h3>
        <app-product-block [products]="products"></app-product-block>

        <app-request-for-calc></app-request-for-calc>

        <div class="works">
            <h3>Наши работы</h3>
            <div class="works_content">
                <img src="/assets/catalogs/accessories/work-1.jpg" alt="work">
                <img src="/assets/catalogs/accessories/work-2.jpg" alt="work">
                <img src="/assets/catalogs/accessories/work-3.jpg" alt="work">
                <img src="/assets/catalogs/accessories/work-4.jpg" alt="work">
            </div>
        </div>
    </div>
</div>

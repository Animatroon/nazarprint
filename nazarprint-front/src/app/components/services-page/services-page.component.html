<div class="services-page">
  <div class="services-page__header">
    <div class="container">
      <h1 class="services-page__title">Наши услуги</h1>
      <p class="services-page__subtitle">Выберите подходящий метод печати для вашего проекта</p>
    </div>
  </div>

  <div class="services-page__content">
    <div class="container">
      <div class="services-page__grid">
        <a
          *ngFor="let service of services"
          [routerLink]="service.link"
          class="services-page__item"
        >
          <div class="services-page__item-image">
            <img [src]="service.image" [alt]="service.name" />
          </div>
          <div class="services-page__item-info">
            <h3 class="services-page__item-name">{{ service.name }}</h3>
            <p class="services-page__item-description">{{ service.description }}</p>
            <span class="services-page__item-btn">Подробнее</span>
          </div>
        </a>
      </div>
    </div>
  </div>

  <app-consultation></app-consultation>

  <div class="services-page__maps">
    <app-maps></app-maps>
  </div>
</div>

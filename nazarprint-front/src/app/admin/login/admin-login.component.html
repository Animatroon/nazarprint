<div class="login-page">
  <div class="login-card">
    <div class="login-card__logo">
      <img src="/assets/logo.png" alt="NazarPrint" />
    </div>
    <h1 class="login-card__title">Вход в панель управления</h1>

    <div class="login-card__error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="onSubmit()" #f="ngForm">
      <div class="form-group">
        <label for="username">Логин</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="admin"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ loading ? 'Вход...' : 'Войти' }}
      </button>
    </form>
  </div>
</div>

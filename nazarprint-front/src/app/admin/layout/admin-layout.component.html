<div class="admin-wrap">
  <aside class="sidebar" [class.sidebar--open]="sidebarOpen">
    <div class="sidebar__brand">
      <img src="/assets/logo.png" alt="NazarPrint" class="sidebar__logo" />
      <span>Admin</span>
    </div>

    <nav class="sidebar__nav">
      <a routerLink="/admin/products" routerLinkActive="active" class="sidebar__link" (click)="closeSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/>
        </svg>
        <span>Товары</span>
      </a>

      <a routerLink="/admin/requests" routerLinkActive="active" class="sidebar__link" (click)="closeSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.99 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.9 1.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 8a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 14.92z"/>
        </svg>
        <span>Заявки</span>
        <span class="sidebar__badge" *ngIf="totalNew > 0">{{ totalNew }}</span>
      </a>
    </nav>

    <button class="sidebar__logout" (click)="logout()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Выйти</span>
    </button>
  </aside>

  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="closeSidebar()"></div>

  <div class="admin-content">
    <header class="topbar">
      <button class="topbar__burger" (click)="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar__title">NazarPrint — Панель управления</div>
      <div class="topbar__badge" *ngIf="totalNew > 0">
        {{ totalNew }} новых заявок
      </div>
    </header>

    <main class="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
